[project]
name = "landscape-archaeology"
version = "0.2.0"
description = "JAX library for loss-landscape diagnostics: Hessian eigenspectrum, sharpness probes, curvature along directions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ammar Tarajia" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.10.0",
    "jaxtyping>=0.3.9",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
    "pre-commit",
    "bandit",
]

[project.urls]
Homepage = "https://github.com/DarkbyteAT/landscape-archaeology"
Repository = "https://github.com/DarkbyteAT/landscape-archaeology"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landscape_archaeology"]
